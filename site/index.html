<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trader Slave · Roadmap</title>
<meta name="description" content="Roadmap di sviluppo di Trader Slave / Trader Slave development roadmap.">
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --text: #1d1d1b;
    --muted: #63635e;
    --line: #e2e1dc;
    --accent: #2457c5;
    --done: #1f7a4d;
    --done-bg: #e3f3ea;
    --doing: #a35c00;
    --doing-bg: #fdf0dc;
    --todo: #63635e;
    --todo-bg: #efeeea;
    --guess-bg: #f3f0fa;
    --guess: #5b3fa3;
    --paused: #6b5fa0;
    --paused-bg: #eeebf7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514;
      --card: #1f1f1d;
      --text: #ecebe6;
      --muted: #a3a29b;
      --line: #34332f;
      --accent: #7ea2ff;
      --done: #6fd39d;
      --done-bg: #1c3328;
      --doing: #f2b55c;
      --doing-bg: #3a2c16;
      --todo: #a3a29b;
      --todo-bg: #2a2a27;
      --guess-bg: #2a2438;
      --guess: #c4b2f2;
      --paused: #b6a9e6;
      --paused-bg: #29253a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 40px 16px 80px; }
  header h1 { margin: 0 0 4px; font-size: 2rem; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); }
  h2 { font-size: 1.3rem; margin: 48px 0 12px; }
  a { color: var(--accent); }
  .lead { margin: 20px 0 0; }

  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 20px 0 0; font-size: 0.9rem; color: var(--muted); }
  .badge {
    display: inline-block; padding: 1px 10px; border-radius: 999px;
    font-size: 0.8rem; font-weight: 600; white-space: nowrap;
  }
  .b-done { background: var(--done-bg); color: var(--done); }
  .b-doing { background: var(--doing-bg); color: var(--doing); }
  .b-todo { background: var(--todo-bg); color: var(--todo); }
  .b-guess { background: var(--guess-bg); color: var(--guess); }

  /* Panoramica */
  ol.overview { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
  ol.overview li {
    display: grid; grid-template-columns: 2.2rem 1fr auto; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
  }
  ol.overview .n { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  ol.overview a { color: inherit; text-decoration: none; }
  ol.overview a:hover { text-decoration: underline; }

  /* Strada a serpentina */
  .hint { margin: 0 0 8px; color: var(--muted); font-size: 0.92rem; }
  .road { position: relative; padding: 8px 0 24px; }
  .road-line { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .road-line path { fill: none; stroke-linecap: round; }
  .road-line .track { stroke: var(--line); stroke-width: 18; }
  .road-line .fill-done { stroke: var(--done); stroke-width: 18; }
  .road-line .fill-doing { stroke: var(--doing); stroke-width: 18; opacity: .55; }
  .road-line .lane { stroke: var(--bg); stroke-width: 2; stroke-dasharray: 8 10; }

  .stop { position: relative; margin: 0; padding: 44px 0; }
  .stop summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 14px;
    width: max-content; max-width: 62%; position: relative; z-index: 1;
  }
  .stop summary::-webkit-details-marker { display: none; }
  .stop:nth-of-type(odd) summary { margin-left: 4%; }
  .stop:nth-of-type(even) summary { margin-left: auto; margin-right: 4%; flex-direction: row-reverse; text-align: right; }
  .dot {
    flex: none; width: 52px; height: 52px; border-radius: 50%;
    display: grid; place-items: center; font-weight: 800; font-size: 1.15rem;
    background: var(--card); border: 3px solid var(--line); color: var(--muted);
    transition: transform .15s ease;
  }
  .stop summary:hover .dot { transform: scale(1.08); }
  .stop.done .dot { background: var(--done); border-color: var(--done); color: var(--card); }
  .stop.doing .dot { border-color: var(--doing); color: var(--doing); background: var(--doing-bg); box-shadow: 0 0 0 6px var(--doing-bg); }
  .label { display: flex; flex-direction: column; gap: 2px; background: var(--bg); padding: 2px 6px; border-radius: 6px; }
  .title { font-weight: 700; font-size: 1.05rem; line-height: 1.3; }
  .meta { display: flex; gap: 8px; align-items: center; }
  .stop:nth-of-type(even) .meta { justify-content: flex-end; }
  .count { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stop[open] .dot { outline: 3px solid var(--accent); outline-offset: 3px; }

  .card {
    position: relative; z-index: 1; margin: 14px 0 0;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px;
    box-shadow: 0 6px 20px rgba(0,0,0,.06);
  }
  .goal { margin: 0; }
  .card h4 { margin: 16px 0 4px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  ul.tasks { list-style: none; padding: 0; margin: 0; }
  ul.tasks li { position: relative; padding-left: 1.6rem; margin: 3px 0; }
  ul.tasks li::before {
    content: ""; position: absolute; left: 0; top: 0.35em;
    width: 0.95em; height: 0.95em; border: 1.5px solid var(--muted); border-radius: 4px;
  }
  ul.tasks li.done { color: var(--muted); }
  ul.tasks li.done::before { background: var(--done); border-color: var(--done); }
  ul.tasks li.done::after {
    content: ""; position: absolute; left: 0.32em; top: 0.48em;
    width: 0.28em; height: 0.52em; border: solid var(--card); border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  ul.tasks li.doing::before { border-color: var(--doing); background: var(--doing-bg); }
  .exit { margin: 0; }
  .guess {
    margin: 14px 0 0; padding: 8px 12px; border-radius: 8px;
    background: var(--guess-bg); color: var(--guess); font-size: 0.92rem;
  }
  .b-next { background: var(--doing-bg); color: var(--doing); }
  .b-paused { background: var(--paused-bg); color: var(--paused); }
  .stop.next .dot { border-color: var(--doing); color: var(--doing); background: var(--doing-bg); box-shadow: 0 0 0 6px var(--doing-bg); }
  .stop.paused .dot { border-style: dashed; border-color: var(--paused); color: var(--paused); background: var(--paused-bg); }

  /* Barra in alto: link al codice e lingua */
  .topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .code-link {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
    background: var(--text); color: var(--bg); text-decoration: none; font-weight: 600; font-size: 0.92rem;
  }
  .code-link:hover { opacity: .88; }
  .code-link svg { width: 18px; height: 18px; fill: currentColor; }
  .code-link .arrow { transition: transform .15s ease; }
  .code-link:hover .arrow { transform: translateX(3px); }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--card); }
  .lang button {
    border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 0.85rem; font-weight: 700;
    padding: 6px 12px; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  @media (max-width: 600px) {
    .stop summary { max-width: 82%; }
    .dot { width: 44px; height: 44px; font-size: 1rem; }
    .title { font-size: 0.98rem; }
  }
  @media (prefers-reduced-motion: reduce) { .dot { transition: none; } }
  ul.plain { padding-left: 1.2rem; margin: 0; }
  ul.plain li { margin: 4px 0; }
  footer { margin-top: 56px; color: var(--muted); font-size: 0.9rem; border-top: 1px solid var(--line); padding-top: 16px; }
</style>
</head>
<body>
<div class="wrap">

<div class="topbar">
  <a class="code-link" id="code-link" href="https://github.com/pittalavito/trader-slave-v2">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    <span data-t="code"></span><span class="arrow" aria-hidden="true">&rarr;</span>
  </a>
  <div class="lang" role="group" aria-label="Lingua / Language">
    <button type="button" data-lang="it">IT</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</div>

<header>
  <h1 data-t="title"></h1>
  <p id="updated"></p>
</header>

<p class="lead" data-t="lead"></p>

<div class="legend" id="legend"></div>

<h2 data-t="overview"></h2>
<ol class="overview" id="overview"></ol>

<h2 data-t="phases"></h2>
<p class="hint" data-t="hint"></p>
<div class="road" id="road"><svg class="road-line" aria-hidden="true"></svg></div>

<h2 data-t="deferred"></h2>
<ul class="plain" id="deferred"></ul>

<h2 data-t="outside"></h2>
<ul class="plain" id="outside"></ul>

<footer data-t="footer"></footer>

</div>
<script src="roadmap.js"></script>
<script>
(function () {
  var R = window.ROADMAP;
  var NS = 'http://www.w3.org/2000/svg';
  var road = document.getElementById('road');
  var svg = road.querySelector('.road-line');
  var lang = 'it';
  var openIds = {};

  function pick() {
    var q = new URLSearchParams(location.search).get('lang');
    if (q === 'it' || q === 'en') return q;
    try { var saved = localStorage.getItem('roadmap-lang'); if (saved === 'it' || saved === 'en') return saved; } catch (e) {}
    return (navigator.language || 'it').toLowerCase().indexOf('it') === 0 ? 'it' : 'en';
  }
  function t(obj) { return obj ? (obj[lang] || obj.it) : ''; }
  function badge(status) { return '<span class="badge b-' + status + '">' + t(R.ui.status[status]) + '</span>'; }

  function render() {
    document.documentElement.lang = lang;
    document.title = t(R.ui.title);
    document.querySelectorAll('[data-t]').forEach(function (el) { el.innerHTML = t(R.ui[el.getAttribute('data-t')]); });
    document.querySelectorAll('.lang button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang)); });
    document.getElementById('code-link').href = R.repo;
    document.getElementById('updated').textContent = t(R.updated);

    document.getElementById('legend').innerHTML =
      ['done', 'doing', 'next', 'paused', 'todo'].map(function (s) { return '<span>' + badge(s) + '</span>'; }).join('') +
      '<span><span class="badge b-guess">' + t(R.ui.guessLabel) + '</span> ' + t(R.ui.guessLegend) + '</span>';

    document.getElementById('overview').innerHTML = R.phases.map(function (p, i) {
      return '<li><span class="n">' + i + '</span><a href="#fase-' + i + '">' + t(p.title) + '</a>' + badge(p.status || 'todo') + '</li>';
    }).join('');

    road.querySelectorAll('.stop').forEach(function (el) { el.remove(); });
    R.phases.forEach(function (p, i) {
      var status = p.status || 'todo';
      var done = p.tasks.filter(function (x) { return x.s === 'done'; }).length;
      var d = document.createElement('details');
      d.className = 'stop ' + status;
      d.id = 'fase-' + i;
      if (openIds[d.id]) d.open = true;
      d.innerHTML =
        '<summary><span class="dot">' + i + '</span><span class="label"><span class="title">' + t(p.title) + '</span>' +
        '<span class="meta">' + badge(status) + '<span class="count">' + done + '/' + p.tasks.length + '</span></span></span></summary>' +
        '<div class="card"><p class="goal">' + t(p.goal) + '</p>' +
        '<h4>' + t(R.ui.tasks) + '</h4><ul class="tasks">' +
        p.tasks.map(function (x) { return '<li' + (x.s && x.s !== 'todo' ? ' class="' + x.s + '"' : '') + '>' + t(x) + '</li>'; }).join('') +
        '</ul><h4>' + t(R.ui.exit) + '</h4><p class="exit">' + t(p.exit) + '</p>' +
        (p.guess ? '<p class="guess"><strong>' + t(R.ui.guessLabel) + ':</strong> ' + t(p.guess) + '</p>' : '') +
        '</div>';
      d.addEventListener('toggle', function () { openIds[d.id] = d.open; draw(); });
      road.appendChild(d);
    });

    document.getElementById('deferred').innerHTML = R.deferred.map(function (x) { return '<li>' + t(x) + '</li>'; }).join('');
    document.getElementById('outside').innerHTML = R.outside.map(function (x) { return '<li>' + t(x) + '</li>'; }).join('');
    draw();
  }

  function draw() {
    var stops = Array.prototype.slice.call(road.querySelectorAll('.stop'));
    var box = road.getBoundingClientRect();
    var pts = stops.map(function (st) {
      var r = st.querySelector('.dot').getBoundingClientRect();
      var s = ['done', 'doing', 'next', 'paused'].filter(function (c) { return st.classList.contains(c); })[0] || 'todo';
      return { x: r.left + r.width / 2 - box.left, y: r.top + r.height / 2 - box.top, s: s };
    });
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    var layers = { track: [], fill: [], lane: [] };
    for (var i = 0; i < pts.length - 1; i++) {
      var a = pts[i], b = pts[i + 1], k = (b.y - a.y) * 0.9;
      // Curva a S con tangenti verticali: la strada scende da una tappa e gira verso la successiva.
      var d = 'M' + a.x + ' ' + a.y + ' C' + a.x + ' ' + (a.y + k) + ' ' + b.x + ' ' + (b.y - k) + ' ' + b.x + ' ' + b.y;
      layers.track.push([d, 'track']);
      // Verde dopo una tappa finita, arancione verso la tappa in corso o prossima.
      if (a.s === 'done') layers.fill.push([d, 'fill-done']);
      else if (a.s === 'doing') layers.fill.push([d, 'fill-doing']);
      layers.lane.push([d, 'lane']);
    }
    ['track', 'fill', 'lane'].forEach(function (name) {
      layers[name].forEach(function (seg) {
        var path = document.createElementNS(NS, 'path');
        path.setAttribute('d', seg[0]);
        path.setAttribute('class', seg[1]);
        svg.appendChild(path);
      });
    });
  }

  function openHash() {
    var el = location.hash && document.getElementById(location.hash.slice(1));
    if (el && el.tagName === 'DETAILS') { el.open = true; el.scrollIntoView({ block: 'start' }); }
  }

  document.querySelectorAll('.lang button').forEach(function (b) {
    b.addEventListener('click', function () {
      lang = b.getAttribute('data-lang');
      try { localStorage.setItem('roadmap-lang', lang); } catch (e) {}
      render();
    });
  });
  window.addEventListener('resize', draw);
  window.addEventListener('hashchange', openHash);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);

  lang = pick();
  render();
  openHash();
})();
</script>
</body>
</html>
